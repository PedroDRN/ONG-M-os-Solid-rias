<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Mãos Solidárias</title>
  <meta name="description" content="ONG Mãos Solidárias - transformando vidas através de ação social, educação e solidariedade.">
  <meta name="theme-color" content="#1b6f5c">
  <!-- Define o tema antes da renderização (evita o "flash" de tema errado) -->
  <script>
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('maos-solidarias:tema')); } catch (e) {}
      if (t !== 'dark') t = 'light'; // padrão: tema claro, como antes
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="pular" href="#app">Pular para o conteúdo</a>

  <header>
    <div class="logo">ONG Mãos Solidárias</div>
    <div class="header-acoes">
      <nav id="nav-principal" aria-label="Navegação principal">
        <ul>
          <li><a href="#/inicio" data-rota="/inicio">Início</a></li>
          <li><a href="#/projetos" data-rota="/projetos">Projetos</a></li>
          <li><a href="#/cadastro" data-rota="/cadastro">Cadastro</a></li>
          <li><a href="#/inicio?s=contato">Contato</a></li>
        </ul>
      </nav>
      <button type="button" id="tema-toggle" class="tema-toggle" aria-pressed="false">
        <span class="tema-icone" aria-hidden="true">🌙</span> Tema escuro
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <footer>
    <p>&copy; 2026 ONG Mãos Solidárias. Todos os direitos reservados.</p>
  </footer>

  <noscript>Este site precisa de JavaScript para funcionar.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
